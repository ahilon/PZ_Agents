[project]
name = "ai-agents"
version = "0.1.0"
description = "AI agents system for task automation and orchestration"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = "^3.12"
dependencies = [
    "openai (>=2.31.0,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.0.0,<3.0.0)",
    "langchain (>=1.2.15,<2.0.0)",
    "requests (>=2.33.1,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pylint (>=4.0.5,<5.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["src"]
skip = [".venv", "venv", "__pycache__"]

[tool.pylint.main]
max-line-length = 120
disable = ["C0114", "C0115", "C0116"]
ignore-paths = [".venv", "venv"]

[tool.pylint.format]
max-line-length = 120
