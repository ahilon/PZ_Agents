services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - .:/app              # mount kodu — zmiany widoczne bez rebuild
      - /app/.venv          # nie nadpisuj venv z obrazu
    restart: unless-stopped

